name: Build, Test & Checks

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

env:
  MY_GIT_USER:  ${{ github.actor }}
  MY_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Full CI pipeline ─────────────────────────────────────────────────────
  CI:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip')"
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (9 + 10 — library multi-targets both)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Run full pipeline
        # build → unit → component → component.applauncher → integration
        # make integration handles: DB wipe, service startup + readiness,
        # test run, service teardown. All lifecycle managed by the Makefile.
        # TEST_OPTS overrides the Makefile default (verbosity=minimal) with
        # verbosity=normal so the TestResultCollector suite summary appears in
        # CI logs — newer dotnet SDK versions filter all test host stdout at
        # minimal verbosity, which hides the summary.
        run: make ci
        env:
          TEST_OPTS: --logger "console;verbosity=normal" -nologo -p:WarningLevel=0 -p:NoWarn=NU1510

  # ── Release (tag-only) ───────────────────────────────────────────────────
  Release:
    needs: CI
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Release source code
        uses: ncipollo/release-action@v1
        with:
          token: ${{ env.MY_GIT_TOKEN }}

  # ── NuGet publish (tag-only) ─────────────────────────────────────────────
  Publish-Nuget:
    needs: Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Get version from tag
        run: echo "VERSION=${GITHUB_REF/refs\/tags\/v/}" >> $GITHUB_ENV

      - name: Pack
        working-directory: ./src/ConfIT
        run: dotnet pack --configuration Release /p:Version=${VERSION} --output .

      - name: Push to NuGet
        working-directory: ./tools
        run: ./push_nuget.sh ${VERSION} "$NUGET_API_TOKEN"
        env:
          NUGET_API_TOKEN: ${{ secrets.NUGET_API_KEY }}
