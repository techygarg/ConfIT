# DSL-002 demonstration: ConfIT integration test definitions in YAML format.
# No mocks — runs against the real User.Api and JustAnotherService.
# Uses a distinct email (yaml@test.com) to avoid conflicts with user.json tests.

ShouldReturnNotFound_ForUnknownYamlUser:
  tags:
    - yaml
    - errors
  api:
    request:
      method: GET
      path: /api/user/no-such-yaml@test.com
    response:
      statusCode: 404
      body:
        error:
          status: 404
          code: NotFound
          description: "User doesn't exist with email : no-such-yaml@test.com"

ShouldCreateUser_InYamlFormat:
  tags:
    - yaml
    - user
  api:
    request:
      method: POST
      path: /api/user
      body:
        name: yaml-user
        email: yaml@test.com
        age: 28
    response:
      statusCode: 201
      body: {}  # semantic matcher removes 'id'; empty body matches the remaining {}
      matcher:
        semantic:
          id: greaterThan(0)  # ID is auto-assigned — any positive integer passes
      extract:
        yamlUserId: $.body.id  # store for the next test

ShouldGetCreatedUser_InYamlFormat:
  tags:
    - yaml
    - user
  api:
    request:
      method: GET
      path: /api/user/{{yamlUserId}}  # injected from the extract above
    response:
      statusCode: 200
      body:
        name: yaml-user
        email: yaml@test.com
        age: 28
      matcher:
        ignore:
          - id

ShouldGetCreatedUser_ByEmail_WithPatternMatcher_InYamlFormat:
  # Exercises matcher.pattern in YAML — validates field shapes with regex
  tags:
    - yaml
    - user
  api:
    request:
      method: GET
      path: /api/user/yaml@test.com
    response:
      statusCode: 200
      body:
        name: yaml-user
        age: 28
      matcher:
        semantic:
          email: "isEmail"  # built-in email validator
        pattern:
          id: "^[0-9]+$"           # any non-negative integer

ShouldGetCreatedUser_ById_WithPatternMatcher_InYamlFormat:
  # Pattern matcher + variable injection together in YAML
  tags:
    - yaml
    - user
  api:
    request:
      method: GET
      path: /api/user/{{yamlUserId}}
    response:
      statusCode: 200
      body:
        name: yaml-user
        email: yaml@test.com
      matcher:
        pattern:
          id: "^[0-9]+$"
        semantic:
          age: "greaterThan(0)"  # built-in email validator
