# Array response matching — inline bodies, file-based bodies, and override on array items.
# /api/examples/1 returns a fixed list of 4 users (ids 11–14).
# /api/examples/2 returns the same list but with age=20 applied to all items.

GetUserList_ExactInlineMatch:
  # Full array matched inline — every element and field asserted exactly.
  # Good baseline: proves the endpoint shape before using matchers.
  tags:
    - arrays
  api:
    request:
      method: GET
      path: /api/examples/1
    response:
      statusCode: 200
      body:
        - id: 11
          name: Eleven
          email: eleven@gmail.com
          age: 11
        - id: 12
          name: Twelve
          email: telve@gmail.com
          age: 12
        - id: 13
          name: Thirteen
          email: thirteen@gmail.com
          age: 13
        - id: 14
          name: Fourteen
          email: fourteen@gmail.com
          age: 14

GetUserList_BodyFromFile:
  # Same array asserted via Response/users-array.json.
  # Moves large or reused expected bodies out of the test file.
  tags:
    - arrays
    - bodyFromFile
  api:
    request:
      method: GET
      path: /api/examples/1
    response:
      statusCode: 200
      bodyFromFile: users-array.json

GetUserList_BodyFromFileWithOverride:
  # override: deep-merges into every array item — one override, all items updated.
  # /api/examples/2 returns the same list with age=20 for all users.
  tags:
    - arrays
    - bodyFromFile
    - override
  api:
    request:
      method: GET
      path: /api/examples/2
    response:
      statusCode: 200
      bodyFromFile: users-array.json
      override:
        age: 20
