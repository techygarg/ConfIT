# DSL-002 demonstration: ConfIT test definitions written in YAML format.
# Functionally identical to JSON — same matchers, mocks, tags, and extractions.
#
# YAML advantages shown here:
#   Comments: annotate intent inline (not possible in JSON)
#   Anchors (&) / aliases (*): define a value once, reference it many times

ShouldReturnNotFound_ForUnknownUser_InYamlFormat:
  # Standalone test — no mock or prior state required
  tags:
    - yaml
  api:
    request:
      method: GET
      path: /api/user/no-such-yaml@test.com
    response:
      statusCode: 404
      body:
        error:
          status: 404
          code: NotFound
          description: "User doesn't exist with email : no-such-yaml@test.com"

ShouldCreateUser_InYamlFormat:
  tags:
    - yaml
    - user
  mock:
    interactions:
        # Anchor the validation-service response body on the first interaction...
      - request:
          method: GET
          path: /api/demo/yaml@test.com
        response:
          statusCode: 200
          body: &valid_body   # anchor defined here
            isValid: true
        # ...then alias it for the remaining two interactions
      - request:
          method: GET
          path: /api/demo
          params:
            email: yaml@test.com
        response:
          statusCode: 200
          body: *valid_body
      - request:
          method: POST
          path: /api/demo
          body:
            email: yaml@test.com
        response:
          statusCode: 200
          body: *valid_body
  api:
    request:
      method: POST
      path: /api/user
      body:
        name: yaml-user
        email: yaml@test.com
        age: 28
    response:
      statusCode: 201
      body: {}  # semantic matcher removes 'id'; empty body matches the remaining {}
      matcher:
        semantic:
          id: greaterThan(0)  # built-in semantic matcher — any positive integer passes

ShouldGetCreatedUser_InYamlFormat:
  tags:
    - yaml
    - user
  api:
    request:
      method: GET
      path: /api/user/yaml@test.com
    response:
      statusCode: 200
      body:
        name: yaml-user
        email: yaml@test.com
        age: 28
      matcher:
        ignore:
          - id  # auto-generated — ignored to keep the test stable
